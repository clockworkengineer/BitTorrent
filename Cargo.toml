[workspace]
resolver = "3"
members = [
    "library",
    "examples/torrent_session_example",
    "examples/torrent_info_example",
    "examples/magnet_dht_example",
    "examples/torrent_fast_resume_example",
    "examples/port_mapping_example",
    "examples/torrent_creator_example",
    "examples/torrent_stream_example",
    "examples/selective_download_example",
    "clients/torrent_client",
    "clients/torrent_client_shared",
    "clients/bt_daemon",
    "clients/bt_webui",
    "clients/sync_hub",
]
default-members = ["clients/torrent_client"]

[workspace.lints.clippy]
collapsible_if = "allow"
useless_vec = "allow"
collapsible_match = "allow"
module_inception = "allow"
await_holding_lock = "allow"
result_unit_err = "allow"
let_underscore_future = "allow"
unwrap_or_default = "allow"
needless_question_mark = "allow"
manual_is_ascii_check = "allow"
needless_borrow = "allow"
needless_borrows_for_generic_args = "allow"
unnecessary_lazy_evaluations = "allow"
manual_div_ceil = "allow"
get_first = "allow"
io_other_error = "allow"
unnecessary_map_or = "allow"
type_complexity = "allow"
chunks_exact_to_as_chunks = "allow"
manual_is_multiple_of = "allow"
manual_checked_ops = "allow"
len_zero = "allow"
too_many_arguments = "allow"
ptr_arg = "allow"
should_implement_trait = "allow"
declare_interior_mutable_const = "allow"
large_const_arrays = "allow"
vec_init_then_push = "allow"
field_reassign_with_default = "allow"
result_large_err = "allow"
upper_case_acronyms = "allow"
single_match = "allow"
manual_range_contains = "allow"
redundant_closure = "allow"
redundant_closure_for_method_calls = "allow"
new_without_default = "allow"
extra_unused_lifetimes = "allow"
assigning_clones = "allow"
match_like_matches_macro = "allow"
from_over_into = "allow"
while_let_loop = "allow"
needless_range_loop = "allow"
for_kv_map = "allow"
uninlined_format_args = "allow"
comparison_chain = "allow"
doc_lazy_continuation = "allow"
single_char_pattern = "allow"
manual_flatten = "allow"
trim_split_whitespace = "allow"
unnecessary_unwrap = "allow"
let_and_return = "allow"
bool_assert_comparison = "allow"
manual_strip = "allow"
redundant_pattern_matching = "allow"
approx_constant = "allow"
identity_op = "allow"
missing_transmute_annotations = "allow"
manual_split_once = "allow"
mut_from_ref = "allow"
needless_return = "allow"
filter_map_identity = "allow"
manual_inspect = "allow"
manual_unwrap_or_default = "allow"
unnecessary_cast = "allow"
manual_pattern_char_comparison = "allow"
suspicious_to_owned = "allow"
redundant_guards = "allow"
unused_enumerate_index = "allow"
redundant_clone = "allow"
unnecessary_sort_by = "allow"
unit_arg = "allow"
missing_safety_doc = "allow"
derivable_impls = "allow"
transmute_ptr_to_ref = "allow"
explicit_auto_deref = "allow"
manual_find = "allow"
manual_clamp = "allow"
manual_rotate = "allow"
manual_while_let_some = "allow"
filter_next = "allow"
useless_conversion = "allow"
useless_asref = "allow"
question_mark = "allow"
range_plus_one = "allow"
search_is_some = "allow"
manual_unwrap_or = "allow"
trivially_copy_pass_by_ref = "allow"
explicit_iter_loop = "allow"
unnecessary_mut_passed = "allow"
needless_late_init = "allow"
blocks_in_conditions = "allow"
unnecessary_map_on_constructor = "allow"
manual_filter_map = "allow"
single_match_else = "allow"
manual_let_else = "allow"
manual_ok_or = "allow"
iter_cloned_collect = "allow"
iter_next_slice = "allow"
iter_overeager_cloned = "allow"
option_as_ref_deref = "allow"
stable_sort_primitive = "allow"
map_entry = "allow"
map_clone = "allow"
clone_on_copy = "allow"
manual_retain = "allow"
write_with_newline = "allow"
drain_collect = "allow"
cast_lossless = "allow"
match_single_binding = "allow"
unused_unit = "allow"
redundant_static_lifetimes = "allow"
redundant_slicing = "allow"
seek_from_current = "allow"
manual_repeat_n = "allow"
manual_c_str_literals = "allow"
boxed_local = "allow"
format_in_format_args = "allow"
manual_bits = "allow"
bind_instead_of_map = "allow"
wrong_self_convention = "allow"
iter_without_into_iter = "allow"
explicit_into_iter_loop = "allow"
collapsible_else_if = "allow"
manual_midpoint = "allow"
manual_abs_diff = "allow"
manual_map = "allow"
suspicious_map = "allow"
nonminimal_bool = "allow"
manual_swap = "allow"
manual_rem_euclid = "allow"
char_lit_as_u8 = "allow"
manual_is_power_of_two = "allow"
case_sensitive_file_extension_comparisons = "allow"
manual_next_back = "allow"
redundant_locals = "allow"
redundant_type_annotations = "allow"
unnecessary_fallible_conversions = "allow"
manual_slice_size_calculation = "allow"
manual_range_patterns = "allow"
manual_hash_one = "allow"
into_iter_without_iter = "allow"
missing_fields_in_debug = "allow"
default_constructed_unit_structs = "allow"
empty_line_after_outer_attr = "allow"
empty_line_after_doc_comments = "allow"
doc_markdown = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
